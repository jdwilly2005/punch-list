<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a315d">
  <script>
    // Light/dark choice from ☰ › This device (js/ui.js setTheme), applied before the page draws.
    try { var t = localStorage.getItem('punchlist:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-title" content="Scope Optimized">
  <title>Scope Optimized</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="icons/app-icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/dexie.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Scope Optimized needs JavaScript turned on.</noscript>
</body>
</html>
